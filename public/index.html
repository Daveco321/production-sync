<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Sync</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060810;--sf:#0c0f18;--cd:#111520;--rs:#161b28;--bd:#1a2035;
  --ac:#4b8dff;--gn:#2dd4a0;--rd:#f0544f;--am:#f5a623;--cy:#22d3ee;--pr:#9d7aff;
  --tx:#cdd5e5;--dm:#4f5b78;--ft:#1e2640;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ft);border-radius:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.mono{font-family:'IBM Plex Mono','SF Mono','Consolas',monospace}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.badge .dot{width:5px;height:5px;border-radius:50%;animation:pulse 2s infinite}

header{padding:0 24px;height:50px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd);background:var(--sf)}
header .logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--ac),var(--cy));display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
header .title{font-size:12px;font-weight:700;letter-spacing:1.5px}
header .right{margin-left:auto;display:flex;align-items:center;gap:8px}

.stats{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;padding:14px 16px;text-align:left;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--cd);transition:all .15s;position:relative;overflow:hidden}
.stat.active{background:color-mix(in srgb,var(--stat-color) 4%,var(--cd))}
.stat.active{border-color:color-mix(in srgb,var(--stat-color) 20%,transparent)}
.stat .bar{position:absolute;top:0;left:0;right:0;height:2px;display:none}
.stat.active .bar{display:block}
.stat .num{font-size:24px;font-weight:700}
.stat .label{font-size:11px;font-weight:600;margin-top:5px}
.stat .sub{font-size:9px;color:var(--dm);margin-top:2px}

.toolbar{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px;padding:7px 10px;background:var(--cd);border:1px solid var(--bd);border-radius:5px;color:var(--tx);font-size:10px;outline:none}
.toolbar input:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(75,141,255,.1)}
.toolbar .btn{padding:5px 10px;font-size:9px;font-weight:600;border-radius:4px;cursor:pointer;border:1px solid var(--bd);background:var(--cd);color:var(--dm);transition:all .12s}
.toolbar .btn:hover{filter:brightness(1.12)}
.toolbar .btn.active{background:rgba(75,141,255,.1);color:var(--ac);border-color:rgba(75,141,255,.25)}
.btn-export{padding:6px 14px!important;background:rgba(45,212,160,.08)!important;border-color:rgba(45,212,160,.15)!important;color:var(--gn)!important}
.btn-sync{padding:6px 12px!important}
.btn-primary{padding:9px 20px!important;background:var(--ac)!important;border:none!important;color:#fff!important;border-radius:6px!important;font-size:11px!important}

.table-wrap{background:var(--cd);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.table-scroll{overflow-x:auto;max-height:calc(100vh - 310px);overflow-y:auto}
table{width:100%;border-collapse:collapse}
th{padding:8px 9px;text-align:left;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2;font-size:8px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--dm);cursor:pointer;white-space:nowrap;user-select:none}
th.sorted{color:var(--ac)}
td{padding:6px 9px;font-size:11px;border-bottom:1px solid rgba(26,32,53,.03);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover td{background:var(--rs)}
.td-po{max-width:240px}
.td-style{font-weight:600}
.td-dim{color:var(--dm)}
.change-item{display:inline-block;margin-right:10px;font-size:10px;white-space:nowrap}
.change-field{color:var(--dm)}
.change-from{color:var(--rd);text-decoration:line-through;opacity:.6}
.change-to{color:var(--gn);font-weight:600}
.footer{padding:7px 12px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;font-size:9px;color:var(--dm)}

.empty{padding:70px 24px;text-align:center}
.empty .icon{font-size:40px;opacity:.1;margin-bottom:14px}
.empty .msg{font-size:12px;color:var(--dm);max-width:380px;margin:0 auto;line-height:1.8}
.loading-bar{height:2px;background:var(--ac);animation:loading 1.5s ease infinite;position:fixed;top:0;left:0;z-index:100}
@keyframes loading{0%{width:0}50%{width:60%}100%{width:100%;opacity:0}}
</style>
</head>
<body>

<div id="loading-bar" class="loading-bar" style="display:none"></div>

<header>
  <div class="logo mono">P</div>
  <span class="title mono">PRODUCTION SYNC</span>
  <div class="right">
    <span id="status-badge"></span>
    <button class="btn mono btn-sync" onclick="forceSync()">⟳ Sync Now</button>
  </div>
</header>

<div id="content" style="padding:16px 24px">
  <div class="empty">
    <div class="icon">⟳</div>
    <div class="msg">Waiting for first sync from Dropbox...<br>The server syncs automatically on startup and every hour.</div>
  </div>
</div>

<script>
const C = {gn:"#2dd4a0",am:"#f5a623",rd:"#f0544f",ac:"#4b8dff",dm:"#4f5b78"};
const stColor = {NEW:C.gn, UPD:C.am, MISS:C.rd};
let currentView = "new";
let currentFilter = "";
let currentSrc = "ALL";
let sortKey = null;
let sortAsc = true;
let data = null;

function badge(color, text, pulse) {
  return `<span class="badge mono" style="background:${color}12;color:${color};border:1px solid ${color}25">${pulse ? `<span class="dot" style="background:${color}"></span>` : ""}${text}</span>`;
}

async function fetchStatus() {
  try {
    const res = await fetch("/api/status");
    const s = await res.json();
    data = s;
    updateUI(s);
  } catch(e) {
    console.error("Fetch error:", e);
  }
}

async function forceSync() {
  document.getElementById("loading-bar").style.display = "block";
  try {
    await fetch("/api/sync", {method:"POST"});
    // Poll until done
    const poll = setInterval(async () => {
      const res = await fetch("/api/status");
      const s = await res.json();
      data = s;
      if (!s.syncing) {
        clearInterval(poll);
        document.getElementById("loading-bar").style.display = "none";
        updateUI(s);
      }
    }, 2000);
  } catch(e) { console.error(e); }
}

function updateUI(s) {
  // Status badge
  const sb = document.getElementById("status-badge");
  if (s.syncing) sb.innerHTML = badge(C.ac, "Syncing...", true);
  else if (s.error) sb.innerHTML = badge(C.rd, "Error");
  else if (s.lastSync) {
    const t = new Date(s.lastSync).toLocaleTimeString();
    sb.innerHTML = badge(C.gn, `Synced ${t}`, true);
  }

  if (!s.analysis) return;
  const a = s.analysis;
  renderDashboard(a, s);
}

function renderDashboard(a, s) {
  const el = document.getElementById("content");
  const stats = [
    {k:"new", v:a.newStyles.length, l:"New Styles", c:C.gn, sub:`ETD after ${a.cutoffDate}`},
    {k:"upd", v:a.updates.length, l:"Updates", c:C.am, sub:"Changed vs your ledger"},
    {k:"miss", v:a.missing.length, l:"Only in Yours", c:C.rd, sub:"Not in factory files"},
    {k:"all", v:a.newStyles.length+a.updates.length, l:"Action Items", c:C.ac, sub:`${a.matched} matched · ${a.ignoredOld} old filtered`},
  ];

  const sources = ["ALL"];
  if (s.factoryCounts.FY1) sources.push("FY1");
  if (s.factoryCounts.NB) sources.push("NB");
  if (s.factoryCounts.PC) sources.push("PC");

  let html = `<div class="stats">${stats.map(st =>
    `<div class="stat ${currentView===st.k?"active":""}" style="--stat-color:${st.c}" onclick="setView('${st.k}')">
      <div class="bar" style="background:${st.c}"></div>
      <div class="num mono" style="color:${st.c}">${st.v}</div>
      <div class="label">${st.l}</div>
      <div class="sub">${st.sub}</div>
    </div>`
  ).join("")}</div>`;

  html += `<div class="toolbar mono">
    <input value="${esc(currentFilter)}" oninput="setFilter(this.value)" placeholder="Search style, PO, prod#...">
    ${sources.map(sr => `<button class="btn ${currentSrc===sr?"active":""}" onclick="setSrc('${sr}')">${sr}</button>`).join("")}
    <a href="/api/export" class="btn btn-export" style="text-decoration:none">↓ Export .xlsx</a>
    <button class="btn btn-sync" onclick="forceSync()">⟳</button>
  </div>`;

  // Build rows
  let rows = getRows(a);
  const total = rows.length;

  html += `<div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>
      ${["_st:Status:62","factory:Src:42","prod:Prod#:92","po:PO Name:240","style:Style:130","units:Units:68","brand:Brand:50","etd:ETD:88"].map(c => {
        const [k,l,w] = c.split(":");
        const sorted = sortKey===k;
        return `<th class="${sorted?"sorted":""}" style="min-width:${w}px" onclick="setSort('${k}')">${l}${sorted?(sortAsc?" ↑":" ↓"):""}</th>`;
      }).join("")}
      <th style="min-width:170px">Changes</th>
    </tr></thead>
    <tbody>`;

  if (!rows.length) {
    html += `<tr><td colspan="9" style="padding:48px;text-align:center;color:var(--dm);font-size:11px" class="mono">No items</td></tr>`;
  }

  rows.forEach(r => {
    const sc2 = stColor[r._st] || C.dm;
    html += `<tr>
      <td>${badge(sc2, r._st)}</td>
      <td class="mono td-dim">${r.factory||"—"}</td>
      <td class="mono">${esc(r.prod)}</td>
      <td class="td-po">${esc(r.po)}</td>
      <td class="mono td-style">${esc(r.style)}</td>
      <td>${r.units!=null?r.units.toLocaleString():"—"}</td>
      <td>${esc(r.brand)||"—"}</td>
      <td class="mono">${r.etd||"—"}</td>
      <td>${r.changes ? r.changes.map(c =>
        `<span class="change-item"><span class="change-field">${c.field}: </span><span class="change-from">${esc(String(c.from))}</span> → <span class="change-to">${esc(String(c.to))}</span></span>`
      ).join("") : r._st==="NEW" ? `<span style="color:${C.gn};font-size:10px">New — ETD ${r.etd}</span>` : r._st==="MISS" ? `<span style="color:${C.rd};font-size:10px">In your ledger only</span>` : ""}</td>
    </tr>`;
  });

  html += `</tbody></table></div>
    <div class="footer mono">
      <span>${total} rows</span>
      <span>FY1:${s.factoryCounts.FY1||0} NB:${s.factoryCounts.NB||0} PC:${s.factoryCounts.PC||0}
        <span style="color:var(--pr)">Yours:${s.davidCount}</span>
        (${a.ignoredOld} old filtered)</span>
    </div></div>`;

  el.innerHTML = html;
}

function getRows(a) {
  let rows = [];
  if (currentView === "new") rows = a.newStyles.map(r => ({...r, _st:"NEW"}));
  else if (currentView === "upd") rows = a.updates.map(u => ({...u.row, _st:"UPD", changes:u.changes}));
  else if (currentView === "miss") rows = a.missing.map(r => ({...r, _st:"MISS", factory:"—"}));
  else rows = [...a.newStyles.map(r => ({...r, _st:"NEW"})), ...a.updates.map(u => ({...u.row, _st:"UPD", changes:u.changes}))];

  if (currentSrc !== "ALL") rows = rows.filter(r => r.factory === currentSrc);
  if (currentFilter) {
    const q = currentFilter.toLowerCase();
    rows = rows.filter(r => [r.prod,r.po,r.style,r.brand,r.etd,r.factory].some(v => v && String(v).toLowerCase().includes(q)));
  }
  if (sortKey) {
    rows.sort((a2,b2) => {
      let av = a2[sortKey] ?? "", bv = b2[sortKey] ?? "";
      if (sortKey === "units") { av = av || 0; bv = bv || 0; }
      if (typeof av === "number" && typeof bv === "number") return sortAsc ? av-bv : bv-av;
      return sortAsc ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });
  }
  return rows;
}

function setView(v) { currentView = v; if (data) renderDashboard(data.analysis, data); }
function setFilter(v) { currentFilter = v; if (data) renderDashboard(data.analysis, data); }
function setSrc(v) { currentSrc = v; if (data) renderDashboard(data.analysis, data); }
function setSort(k) { if (sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=true; } if (data) renderDashboard(data.analysis, data); }
function esc(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// Poll every 30s
fetchStatus();
setInterval(fetchStatus, 30000);
</script>
</body>
</html>
